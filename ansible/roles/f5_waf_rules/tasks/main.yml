---
- name: Ensure rules conf directory exists
  ansible.builtin.file:
    path: "{{ f5_waf_rules_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy signature rule pack
  ansible.builtin.copy:
    src: "{{ f5_waf_rules_pack_file }}"
    dest: "{{ f5_waf_rules_conf_dir }}/{{ f5_waf_rules_pack_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Materialize overrides on controller for compile
  ansible.builtin.copy:
    dest: "/tmp/f5_waf_rule_overrides_{{ inventory_hostname }}.json"
    content: "{{ f5_waf_rule_overrides | to_nice_json }}"
  delegate_to: localhost
  become: false

- name: Compile signature sets from pack + overrides
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../python/scripts/compile_rules.py"
      - "--pack"
      - "{{ role_path }}/files/{{ f5_waf_rules_pack_file }}"
      - "--overrides"
      - "/tmp/f5_waf_rule_overrides_{{ inventory_hostname }}.json"
      - "--output"
      - "/tmp/{{ f5_waf_rules_compiled_file }}_{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Install compiled signature sets on target
  ansible.builtin.copy:
    src: "/tmp/{{ f5_waf_rules_compiled_file }}_{{ inventory_hostname }}"
    dest: "{{ f5_waf_rules_conf_dir }}/{{ f5_waf_rules_compiled_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Persist overrides on target for audit
  ansible.builtin.copy:
    content: "{{ f5_waf_rule_overrides | to_nice_json }}"
    dest: "{{ f5_waf_rules_conf_dir }}/rule_overrides.json"
    owner: root
    group: root
    mode: "0644"

- name: Fetch target policy for merge
  ansible.builtin.fetch:
    src: "{{ f5_waf_rules_conf_dir }}/{{ f5_waf_rules_target_policy }}.json"
    dest: "/tmp/{{ inventory_hostname }}_{{ f5_waf_rules_target_policy }}.json"
    flat: true
  when: f5_waf_rules_target_policy | length > 0

- name: Merge compiled sets into target policy on controller
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../python/scripts/merge_rules_into_policy.py"
      - "--policy"
      - "/tmp/{{ inventory_hostname }}_{{ f5_waf_rules_target_policy }}.json"
      - "--compiled"
      - "/tmp/{{ f5_waf_rules_compiled_file }}_{{ inventory_hostname }}"
      - "--output"
      - "/tmp/{{ inventory_hostname }}_{{ f5_waf_rules_target_policy }}.merged.json"
  delegate_to: localhost
  become: false
  when: f5_waf_rules_target_policy | length > 0
  changed_when: true

- name: Install merged policy on target
  ansible.builtin.copy:
    src: "/tmp/{{ inventory_hostname }}_{{ f5_waf_rules_target_policy }}.merged.json"
    dest: "{{ f5_waf_rules_conf_dir }}/{{ f5_waf_rules_target_policy }}.json"
    owner: root
    group: root
    mode: "0644"
  when: f5_waf_rules_target_policy | length > 0
  notify: Reload nginx
