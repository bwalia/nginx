user  nginx;
worker_processes  auto;
load_module modules/ngx_http_app_protect_module.so;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # In App Protect WAF v5 the NGINX module talks to the separate enforcer
    # container over gRPC. This address matches the waf-enforcer service in
    # docker-compose.f5.yml.
    app_protect_enforcer_address waf-enforcer:50000;

    upstream origin_app {
        server origin:8080;
    }

    server {
        listen 8080;
        server_name _;

        # Turn App Protect on for this server and attach the policy.
        app_protect_enable on;
        app_protect_policy_file "/etc/app_protect/policies/acme_bank_policy.json";
        app_protect_security_log_enable on;
        app_protect_security_log "/opt/app_protect/share/defaults/log_all.json" stderr;

        location / {
            proxy_pass http://origin_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
