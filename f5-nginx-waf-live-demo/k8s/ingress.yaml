apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
  annotations:
    # Matches the convention the other *.fictionally.org ingresses use so
    # external-dns publishes the record automatically (CNAME -> the wslproxy pop).
    external-dns.alpha.kubernetes.io/hostname: payments.fictionally.org
    external-dns.alpha.kubernetes.io/target: pop0.wslproxy.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik
  rules:
    # Routed to the WAF running on the k3s node (deploy/node-demo.compose.yml),
    # via the node-waf external-backend Service (see node-waf-backend.yaml).
    # To route to the in-cluster WAF pod instead, set service name=waf port=8080.
    - host: payments.fictionally.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-waf
                port:
                  number: 9080
