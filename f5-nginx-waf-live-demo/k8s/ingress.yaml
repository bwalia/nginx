apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
  annotations:
    # Matches the convention the other *.fictionally.org ingresses use so
    # external-dns publishes the record automatically (CNAME -> the wslproxy pop).
    external-dns.alpha.kubernetes.io/hostname: payments.fictionally.org
    external-dns.alpha.kubernetes.io/target: lon1.pop0.uk
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik
  rules:
    # Routed to the in-cluster WAF pod (waf Deployment/Service), which proxies to
    # the in-cluster origin pod. Fully self-contained in the cluster — no hop out
    # to the plain VM. To route to the node WAF instead, set name=node-waf port=9080
    # (see node-waf-backend.yaml).
    - host: payments.fictionally.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waf
                port:
                  number: 8080
