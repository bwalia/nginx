# Routes the payments ingress to the WAF running as a Docker container on a k3s
# node (deploy/node-demo.compose.yml on 192.168.1.140:9080) instead of the
# in-cluster WAF pod. This is a Service with NO selector plus a hand-written
# EndpointSlice pointing at the node -- the standard way to send an Ingress to an
# off-cluster endpoint. Traefik reads the EndpointSlice and forwards directly.
#
# If the node IP or port changes, update the EndpointSlice below.
apiVersion: v1
kind: Service
metadata:
  name: node-waf
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
  # no selector -> endpoints are supplied manually by the EndpointSlice below
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-waf-1
  labels:
    kubernetes.io/service-name: node-waf
    app.kubernetes.io/part-of: f5-nginx-waf-demo
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9080
endpoints:
  - addresses:
      - "192.168.1.140"      # k3s node running the Docker WAF (debian001)
    conditions:
      ready: true
