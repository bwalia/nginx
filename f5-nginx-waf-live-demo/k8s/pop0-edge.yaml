# ---------------------------------------------------------------------------
# Edge copy of the WAF + origin, pinned to the wslproxy pop node `cloud001`.
#
# The pop runs the wslproxy (OpenResty) gateway and can only reach node-LOCAL
# NodePorts — it is network-isolated from the home cluster's Services/pods. So to
# publish `waf.pop0.uk` through wslproxy (server+rule -> 127.0.0.1:30085) the WAF
# and origin must run on the pop itself. This is a self-contained stand-in of the
# home f5-waf-demo stack; the home Traefik ingress + Grafana console are separate
# and unchanged. Audit logs go to stdout here (the home Loki/Grafana can't be
# reached from the isolated edge).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origin-edge
  labels:
    app: origin-edge
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin-edge
  template:
    metadata:
      labels:
        app: origin-edge
    spec:
      nodeSelector:
        kubernetes.io/hostname: cloud001
      tolerations:
        - key: node-role.kubernetes.io/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: origin
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          env:
            - name: PORT
              value: "8080"
            - name: SAFE_MODE
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: origin-app
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: origin-edge
  labels:
    app: origin-edge
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  selector:
    app: origin-edge
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-edge
  labels:
    app: waf-edge
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-edge
  template:
    metadata:
      labels:
        app: waf-edge
    spec:
      nodeSelector:
        kubernetes.io/hostname: cloud001
      tolerations:
        - key: node-role.kubernetes.io/edge
          operator: Equal
          value: "true"
          effect: NoSchedule
      automountServiceAccountToken: false
      containers:
        - name: waf
          image: owasp/modsecurity-crs:nginx
          env:
            - name: BACKEND
              value: "http://origin-edge:8080"
            - name: PORT
              value: "8080"
            - name: MODSEC_RULE_ENGINE
              value: "On"
            - name: PARANOIA
              value: "1"
            - name: ANOMALY_INBOUND
              value: "5"
            - name: ANOMALY_OUTBOUND
              value: "4"
            - name: BLOCKING_PARANOIA
              value: "1"
            - name: MODSEC_RESP_BODY_ACCESS
              value: "On"
            - name: MODSEC_AUDIT_ENGINE
              value: "RelevantOnly"
            - name: MODSEC_AUDIT_LOG
              value: "/dev/stdout"
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
            - name: SERVERTOKENS
              value: "off"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Node-local NodePort on the pop; the wslproxy rule points at 127.0.0.1:30085.
apiVersion: v1
kind: Service
metadata:
  name: waf-edge
  labels:
    app: waf-edge
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  type: NodePort
  selector:
    app: waf-edge
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30085
