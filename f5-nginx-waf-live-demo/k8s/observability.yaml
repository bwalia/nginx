# ---------------------------------------------------------------------------
# WAF observability: a real "Web UI to see logs".
#
#   waf pod ──(SecAuditLog JSON → shared file)──▶ promtail sidecar ──▶ Loki ──▶ Grafana
#
# The WAF writes its ModSecurity audit log (rich per-violation JSON: matched
# rule, data, anomaly score, client, URI) to a file on a shared volume. A
# promtail sidecar in the same pod tails that file and ships it to Loki. Grafana
# is pre-provisioned with a Loki datasource and a "F5 NGINX WAF — Live Violations"
# dashboard. Everything is namespaced in f5-waf-demo and tears down with kustomize.
#
# Reach Grafana:  kubectl -n f5-waf-demo port-forward svc/grafana 3000:3000
#                 http://localhost:3000  (admin / see grafana-admin Secret)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_streams_per_user: 0
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
# promtail config consumed by the sidecar added to the waf Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: modsec-audit
        static_configs:
          - targets: [localhost]
            labels:
              job: modsec-audit
              app: waf
              namespace: f5-waf-demo
              __path__: /var/log/modsec/audit.log
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
type: Opaque
stringData:
  admin-user: admin
  admin-password: waf-demo-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          maxLines: 1000
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: waf
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
data:
  waf-violations.json: |
    {
      "title": "F5 NGINX WAF — Live Violations",
      "uid": "waf-violations",
      "tags": ["waf", "modsecurity", "security"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "type": "stat",
          "title": "Total violations (range)",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "options": {"reduceOptions": {"calcs": ["sum"]}, "graphMode": "area", "colorMode": "value"},
          "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"modsec-audit\"}[$__range]))", "queryType": "instant"}]
        },
        {
          "type": "timeseries",
          "title": "Violations over time",
          "gridPos": {"h": 5, "w": 18, "x": 6, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "bars", "fillOpacity": 60}}},
          "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"modsec-audit\"}[$__interval]))", "legendFormat": "violations"}]
        },
        {
          "type": "table",
          "title": "Top rules triggered",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "loki", "uid": "loki"},
          "options": {"showHeader": true},
          "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "topk(10, sum by (rule) (count_over_time({job=\"modsec-audit\"} | json rule=\"transaction.messages[0].message\" [$__range])))", "queryType": "instant", "format": "table"}]
        },
        {
          "type": "table",
          "title": "Top attacking client IPs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "datasource": {"type": "loki", "uid": "loki"},
          "options": {"showHeader": true},
          "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "topk(10, sum by (client) (count_over_time({job=\"modsec-audit\"} | json client=\"transaction.client_ip\" [$__range])))", "queryType": "instant", "format": "table"}]
        },
        {
          "type": "logs",
          "title": "Live violation log",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 13},
          "datasource": {"type": "loki", "uid": "loki"},
          "options": {"showTime": true, "wrapLogMessage": true, "dedupStrategy": "none", "enableLogDetails": true},
          "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "{job=\"modsec-audit\"} | json ip=\"transaction.client_ip\", method=\"transaction.request.method\", uri=\"transaction.request.uri\", code=\"transaction.response.http_code\", rule=\"transaction.messages[0].message\" | line_format \"{{.ip}}  {{.method}} {{.uri}}  ->  {{.code}}  [{{.rule}}]\""}]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: dashboards-provider
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Optional public access to the WAF console. Grafana already requires a login;
# a Traefik basic-auth gate is layered in front so anonymous internet scanners
# never reach Grafana directly. Reach it at https://waf-console.fictionally.org/
# once the Cloudflare CNAME (-> pop0.wslproxy.com, DNS-only) is added. Same demo
# credential as the "before" host: user `demo`.
apiVersion: v1
kind: Secret
metadata:
  name: console-basic-auth
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
type: Opaque
stringData:
  users: |
    demo:$2y$05$qG3iKSrkwesTbDnBFnXyu.rrnGIyDLhT4ybmOHN1KCM.sHNlB.vVy
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: console-basic-auth
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  basicAuth:
    secret: console-basic-auth
    realm: "F5 WAF demo -- WAF console"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waf-console
  labels:
    app.kubernetes.io/part-of: f5-nginx-waf-demo
  annotations:
    external-dns.alpha.kubernetes.io/hostname: waf-console.fictionally.org
    external-dns.alpha.kubernetes.io/target: pop0.wslproxy.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.middlewares: f5-waf-demo-console-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: waf-console.fictionally.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
