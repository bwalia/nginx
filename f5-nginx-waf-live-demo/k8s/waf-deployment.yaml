apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  labels:
    app: waf
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      # OWASP Core Rule Set on ModSecurity-NGINX -- the license-free stand-in
      # for F5 NGINX App Protect WAF. Swap this image + config for the real F5
      # engine (see ../f5-app-protect/) without touching anything else.
      automountServiceAccountToken: false
      initContainers:
        # Make the shared audit-log dir writable by the nginx worker (uid 101)
        # and readable by the promtail sidecar.
        - name: init-logdir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/modsec && chmod 0777 /var/log/modsec"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: modsec-logs
              mountPath: /var/log/modsec
      containers:
        - name: waf
          image: owasp/modsecurity-crs:nginx
          env:
            - name: BACKEND
              value: "http://origin:8080"
            - name: PORT
              value: "8080"
            - name: MODSEC_RULE_ENGINE
              value: "On"
            - name: PARANOIA
              value: "1"
            - name: ANOMALY_INBOUND
              value: "5"
            - name: ANOMALY_OUTBOUND
              value: "4"
            - name: BLOCKING_PARANOIA
              value: "1"
            - name: MODSEC_RESP_BODY_ACCESS
              value: "On"
            - name: MODSEC_AUDIT_ENGINE
              value: "RelevantOnly"
            - name: MODSEC_AUDIT_LOG
              value: "/var/log/modsec/audit.log"   # tailed by the promtail sidecar
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
            - name: SERVERTOKENS
              value: "off"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: modsec-logs
              mountPath: /var/log/modsec
        # Ships the WAF's ModSecurity audit log (JSON per violation) to Loki.
        - name: promtail
          image: grafana/promtail:2.9.8
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: modsec-logs
              mountPath: /var/log/modsec
              readOnly: true
            - name: promtail-config
              mountPath: /etc/promtail
            - name: promtail-run
              mountPath: /run/promtail
      volumes:
        - name: modsec-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: promtail-run
          emptyDir: {}
