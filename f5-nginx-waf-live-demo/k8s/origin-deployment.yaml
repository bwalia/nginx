apiVersion: apps/v1
kind: Deployment
metadata:
  name: origin
  labels:
    app: origin
    app.kubernetes.io/part-of: f5-nginx-waf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin
    spec:
      # The origin is deliberately vulnerable, so it gets no API access and the
      # tightest runtime sandbox we can give it: non-root, read-only rootfs, no
      # extra capabilities. SAFE_MODE (set below) also stops it from ever
      # touching a real shell or the real filesystem.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: origin
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          env:
            - name: PORT
              value: "8080"
            - name: SAFE_MODE          # simulate exploits, never really run them
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: origin-app     # generated by kustomize from ../origin/app.py
        - name: tmp
          emptyDir: {}
