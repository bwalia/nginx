name: f5-nginx-waf-demo

# Public demo (primary): http://192.168.1.177:8083/  (API GW + WAF)
#                        http://192.168.1.177:8081/  (open origin)
#                        http://192.168.1.177:8082/  (CRS WAF)
# HH aliases also published: :18081 / :18082 / :18083

x-public-host: &public_host "192.168.1.177"

services:
  origin:
    build: ./origin
    container_name: waf-demo-origin
    environment:
      PORT: "8080"
      STMT_DIR: /srv/statements
      SAFE_MODE: "0"
      PUBLIC_HOST: *public_host
      PUBLIC_OPEN: "https://payments-open.fictionally.org"
      PUBLIC_SECURE: "https://payments-secure.fictionally.org"
      PUBLIC_APIGEE: "https://apigee-lab.fictionally.org"
      PUBLIC_LAN_OPEN: "http://192.168.1.177:8081"
      PUBLIC_LAN_APIGW: "http://192.168.1.177:8083"
    volumes:
      - ./lab/lab.html:/app/lab.html:ro
    ports:
      - "18081:8080"
      - "8081:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf-demo-waf
    depends_on:
      origin:
        condition: service_healthy
    ports:
      - "18082:8080"
      - "8082:8080"
    environment:
      BACKEND: "http://origin:8080"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      BLOCKING_PARANOIA: "1"
      MODSEC_RESP_BODY_ACCESS: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      SERVERTOKENS: "off"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  apigw:
    build: ./apigw
    container_name: waf-demo-apigw
    depends_on:
      origin:
        condition: service_healthy
    environment:
      PORT: "8083"
      ORIGIN_URL: "http://origin:8080"
      LAB_HTML: "/demo/lab/lab.html"
      FEATURES_HTML: "/demo/docs/features.html"
      API_KEY: demo-f5-key
      SPIKE_PER_MIN: "120"
      PUBLIC_OPEN: "https://payments-open.fictionally.org"
      PUBLIC_SECURE: "https://payments-secure.fictionally.org"
      PUBLIC_APIGEE: "https://apigee-lab.fictionally.org"
    volumes:
      - ./lab/lab.html:/demo/lab/lab.html:ro
      - ./docs/features.html:/demo/docs/features.html:ro
      - ./apigw/gateway.py:/demo/gateway.py:ro
    ports:
      # Primary LAN / HH publish path
      - "18083:8083"
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8083/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 8
    restart: always
